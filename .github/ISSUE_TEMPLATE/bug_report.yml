name: Bug report
description: A triage verdict that was wrong, or output that surprised you
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Triage disagreements are especially useful —
        please give enough detail that someone else can reproduce what you saw.

  - type: input
    id: invocation
    attributes:
      label: How did you invoke the skill?
      description: The exact prompt or slash command you used.
      placeholder: e.g. "triage: audit every page on my site for broken links"
    validations:
      required: true

  - type: textarea
    id: verdict
    attributes:
      label: What verdict did it return?
      description: Include the Verdict, Confidence, and Fit Scores if you have them.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What verdict did you expect, and why?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Task context
      description: |
        Anything relevant about the task you were triaging — scope, risk,
        whether it touched production, how independent the units were.
    validations:
      required: false

  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      placeholder: e.g. "Claude Code 1.x"
    validations:
      required: false
